name: Test Runner for videomail-client (CI)

on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [published]

# Least privilege 🔐
#
# CI only reads the code. Without this,
# the token inherits the repository default, which can push commits and tags.
# Otherwise, npm install scripts from any of our ~1,000 dev packages would run with that power.
permissions:
  contents: read

jobs:
  build-test-lint-check:
    name: Build, Test, Prettier, Lint and Check
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout code
        # Pinned to a commit SHA because tags can be moved. Bump both together.
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: 🪛 Install Node.js via nvm
        shell: bash --login {0}
        run: |
          nvm install --no-progress
          echo "$(dirname $(nvm which node))" >> $GITHUB_PATH

      - name: 📦 Install npm dependencies
        run: npm ci

      - parallel:
          - name: 🔎 Run prettier
            run: node --run prettier

          - name: 🔎 Run linter
            run: node --run lint

          - name: 🔎 Check types
            run: node --run types

          - name: 🔨 Build
            run: node --run build:prod

          - name: 🔎 Audit (detect vulnerabilities)
            run: node --run audit

          - name: 🔎 Run tests
            run: node --run test

          - name: 🔎 Run Chromatic
            env:
              CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
            # Pull requests from forks get no secrets. Skip instead of failing them.
            run: |
              if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
                echo "Skipping Chromatic: no project token (e.g. a pull request from a fork)."
                exit 0
              fi

              npm run chromatic -- --project-token="$CHROMATIC_PROJECT_TOKEN"
